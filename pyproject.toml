[project]
name = "sdlc-template"
version = "0.1.0"
description = "A process-first template repository demonstrating a complete software development lifecycle."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "David Bellamy" }]

# Runtime dependencies go here. The template ships with none on purpose so the
# example package stays trivial; replace the example module with your own.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.15.16",
  "ty>=0.0.44",
  "pytest>=8",
  "pytest-cov>=5",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_template"]

# ---------------------------------------------------------------------------
# Lint + format: ruff (Astral). This file is the SOURCE OF TRUTH for code
# standards; CONTRIBUTING.md narrates it but never restates the rules.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, N naming, W warnings, UP pyupgrade,
# B bugbear, SIM simplify, C4 comprehensions, PIE, RET returns, RUF ruff,
# PT pytest, TCH type-checking blocks, PTH use-pathlib, D docstrings.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "PT", "TCH", "PTH", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Type checking: ty (Astral). Replaces mypy. Invoked in CI as `uvx ty check`.
# ty is pre-1.0 and reads sensible defaults; keep config minimal and pin the
# environment so local and CI agree.
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# Tests: pytest. --strict-markers/--strict-config fail on typos in markers or
# config rather than silently ignoring them.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
