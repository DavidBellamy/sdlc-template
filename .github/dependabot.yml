version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    # Group dev-tool bumps into one PR to cut review noise.
    groups:
      dev-tools:
        patterns:
          - "ruff"
          - "ty"
          - "pytest*"
          - "pre-commit"
